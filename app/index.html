<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover</h1>
    <p class="tagline">Your photos, made into a GTA-style poster. Everything runs offline, on your machine.</p>

    <fieldset>
      <legend>1 · Photos</legend>
      <label class="file-btn">Add photos from your machine
        <input id="addPhotos" type="file" accept="image/*" multiple>
      </label>
      <p class="hint">Or drag &amp; drop images onto the preview. Up to 3 photos.</p>
      <div class="row">
        <button type="button" data-sample="pier">Sample: Pier</button>
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
      </div>
      <div class="tabs" role="group" aria-label="Photo slots">
        <button type="button" data-photo-tab="0">Photo 1 +</button>
        <button type="button" data-photo-tab="1">Photo 2 +</button>
        <button type="button" data-photo-tab="2">Photo 3 +</button>
      </div>
      <label>Zoom <span id="zoomVal">—</span>
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
      </label>
      <div class="row">
        <label>Pan left–right <input id="panx" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
        <label>Pan up–down <input id="pany" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      </div>
      <div class="row">
        <button id="fillAll" type="button">Fill all panels with this photo</button>
        <button id="removePhoto" type="button">Remove photo</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>2 · Panels &amp; grade</legend>
      <div class="row segmented" role="group" aria-label="Layout">
        <button type="button" data-layout="sunset" class="active">Sunset</button>
        <button type="button" data-layout="neon">Neon strips</button>
        <button type="button" data-layout="boulevard">Boulevard</button>
      </div>
      <div class="row">
        <label>Hero panel <select data-panel="0"><option value="0">Photo 1</option><option value="1">Photo 2</option><option value="2">Photo 3</option></select></label>
        <label>Panel 2 <select data-panel="1"><option value="0">Photo 1</option><option value="1">Photo 2</option><option value="2">Photo 3</option></select></label>
        <label>Panel 3 <select data-panel="2"><option value="0">Photo 1</option><option value="1">Photo 2</option><option value="2">Photo 3</option></select></label>
      </div>
      <div class="row segmented" role="group" aria-label="Colour grade">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="noir">Noir</button>
      </div>
      <label>Grade strength <span id="gradeVal">100%</span>
        <input id="gradeStrength" type="range" min="0" max="1" step="0.05" value="1">
      </label>
      <label class="check"><input id="sunMotif" type="checkbox" checked> Retro sun motif on the hero panel</label>
    </fieldset>

    <fieldset>
      <legend>3 · Caption</legend>
      <label>Title <input id="title" type="text" maxlength="32" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="VICE CITY NIGHTS"></label>
      <label>Title style
        <select id="titleStyle">
          <option value="pop">Pop — white with pink shadow</option>
          <option value="neon">Neon — glowing outline</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>4 · Export</legend>
      <div class="row segmented" role="group" aria-label="Export size">
        <button type="button" data-size="square" class="active">1080 × 1080</button>
        <button type="button" data-size="portrait">1080 × 1350</button>
        <button type="button" data-size="landscape">1920 × 1080</button>
      </div>
      <button id="exportOne" type="button" class="primary">Export PNG at this size</button>
      <button id="exportAll" type="button">Export all three sizes</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>

  <section id="preview" class="preview" data-size="square" aria-label="Live preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
    <p class="drop-hint">Drop photos here</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
